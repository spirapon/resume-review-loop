# ============================================================
# TAILORED OUTPUT — example / schema reference
# This is what resume-tailor writes into an application folder as `resume.yaml`.
# You do not write this by hand; it is generated from master.yaml per job.
# It is here so you can see the shape the template and fact_check.py expect.
# ============================================================
# Every text node carries `source:` (or `sources:` for a merged bullet) pointing
# at fact IDs in master.yaml. fact_check.py resolves each one and compares the
# numbers; an unresolvable source or a changed number exits 1.
# ============================================================

contact:
  # Copied verbatim from master.yaml — fact_check.py compares these strings exactly.
  name: "Ada Example"
  email: "ada@example.com"
  phone: "+1 555 0100"
  location: "Berlin, Germany — open to relocation"
  linkedin: "https://linkedin.com/in/example"

summary:
  text: "Data scientist with 8 years building data pipelines and ML models in production."
  source: [sum1]
  highlights:
    - text: "M.Sc. in Computer Science, specialising in machine learning"
      source: [sum2]
  closing: "Translates model output into decisions non-technical stakeholders can act on."
  closing_source: [sum3]

skills:
  # Grouped into lines by category. Order the groups by what this job cares about.
  - category: "Languages & Tools"
    items:
      - text: "Python"
        source: [sk1]
      - text: "SQL"
        source: [sk2]
  - category: "ML & AI"
    items:
      - text: "RAG / LangChain"
        source: [sk3]

experience:
  - id: exp1
    company: "Northwind Analytics"
    title: "Senior Data Scientist"
    location: "Berlin, Germany"
    start: "2022-03"
    end: "present"
    bullets:
      - text: "Automated the weekly stock report previously assembled by hand, cutting turnaround from 3 days to 4 hours."
        source: [exp1.b1]
      - text: "Moved model training and scoring onto a scheduled orchestration pipeline with automated data-quality checks."
        source: [exp1.b2]
  - id: exp2
    company: "Contoso Retail"
    title: "Data Analyst"
    location: "Munich, Germany"
    start: "2019-01"
    end: "2022-02"
    bullets:
      # A merged bullet cites every fact it draws from.
      - text: "Rebuilt weekly sales reporting, replacing 6 manual reports with 1 modelled dashboard used by ~25 people, with metric definitions agreed with category managers."
        sources: [exp2.b1, exp2.b2]

projects:
  - id: proj1
    name: "Open Air — city air-quality dashboard"
    url: "https://github.com/example/open-air"
    bullets:
      - text: "Collected public sensor readings from 12 stations on an hourly refresh and published a live map with a 24-hour forecast per station."
        source: [proj1.b1]

education:
  - id: edu1
    degree: "M.Sc."
    field: "Computer Science"
    school: "Technical University of Munich"
    year: "2018"
    details:
      - text: "Thesis: Anomaly Detection in Streaming Sensor Data"
        source: [edu1]

certifications:
  - text: "AWS Certified Machine Learning – Specialty (2023)"
    source: [cert1]

publications:
  - text: "Anomaly Detection in Streaming Sensor Data — Example Workshop on Data Engineering, 2018"
    source: [pub1]

languages:
  - text: "English (native)"
    source: [lang1]
  - text: "German (professional, C1)"
    source: [lang2]
