# ============================================================
# MASTER PROFILE — example / schema reference
# Copy this to master.yaml and replace everything with YOUR real facts.
# ============================================================
# RULES
#   - Every fact has an ID. Agents cite IDs; fact_check.py verifies them.
#   - Numbers must be real. Agents copy them EXACTLY, never round or inflate.
#   - angles tag which job type a fact supports:
#       ds = Data Scientist, mle = ML Engineer, ai = AI Engineer, bi = BI Engineer
#   - `metrics` is also where you put GUARDRAILS. A trailing comment like
#     "# POC — never claim production usage" is read by the reviewing agents
#     and stops them overselling. Use it liberally; it is the main honesty lever.
#   - `# TODO:` marks a fact that needs a real number you have not dug up yet.
# ============================================================

